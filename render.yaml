services:
  - type: web
    name: ruralbiz-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
